{% extends "base.html" %}

{% block content %}

<div class="container">
    <h1>Inscrire un nouvel étudiant</h1>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Enregistrer l'étudiant</button>

        <a href="{% url 'students:list' %}">Annuler</a>
    </form>
</div>

{% endblock %}
